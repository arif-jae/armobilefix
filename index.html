<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>บัญชีร้านซ่อมมือถือ</title>

<style>
:root{--bg:#eceff2;--sf:#fff;--tx:#14202c;--mu:#667585;--bd:#dde2e8;--ink:#12202f;--ac:#f5b700;--ac-ink:#231a00;--in:#0f8a55;--out:#cf3f2e;--ring:#2f6fe0;--st0:#7b8794;--st1:#d98200;--st2:#2f6fe0;--st3:#0f8a55;--st4:#7c3aed;box-sizing:border-box}

:root[data-theme="dark"]{--bg:#0e151c;--sf:#17212b;--tx:#e7edf3;--mu:#8b99a8;--bd:#263341;--ink:#1d2d3e;--in:#3ddc97;--out:#ff7a68;--ring:#6ea3ff;--st0:#8b99a8;--st1:#f5b700;--st2:#6ea3ff;--st3:#3ddc97;--st4:#b794f6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;padding-bottom:150px}

button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.split>button{justify-content:center}

.rl{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}.rl.ow{background:var(--ink);color:#fff;border-color:var(--ink)}.rl.off{color:var(--out);border-color:var(--out)}

button.sm{border:1px solid var(--bd);border-radius:8px;background:none;color:var(--mu);padding:3px 9px;font-size:12px;cursor:pointer}button.sm:hover{color:var(--out);border-color:var(--out)}
body.staff .sm,body.staff .pf{display:none}
p.s{margin:14px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:130px;border:0;background:none;color:var(--mu);padding:9px 2px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav button.on{color:var(--tx);font-weight:600}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.mod{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod.show{display:flex}
.mod>div{background:var(--sf);width:100%;max-width:440px;border-radius:20px;padding:20px 18px;max-height:88vh;overflow:auto;animation:pop .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{display:none}
#mbody>b,#mbody>h2{display:block;font-size:18px;font-weight:600;margin:0 0 4px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:500}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.bar{display:flex;gap:8px;margin:16px 0 0}
.mod .bar{position:sticky;bottom:-20px;background:var(--sf);margin:12px 0 -20px;padding:12px 0 20px;border-top:1px solid var(--bd)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:20px}.card>b{font-family:Prompt,sans-serif;font-size:18px}
.fab{position:fixed;z-index:7;right:max(16px,calc((100vw - 760px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--ac-ink);display:none;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab:active{transform:scale(.94)}.fab svg{transition:transform .15s}.fab.open svg{transform:rotate(45deg)}
.popwrap{position:fixed;inset:0 0 calc(59px + env(safe-area-inset-bottom,0px)) 0;z-index:6;display:none;background:rgba(10,20,30,.28)}
.pop{position:absolute;right:max(16px,calc((100vw - 760px)/2 + 16px));bottom:83px;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px}
.pi{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 22px 6px 7px;border:0;border-radius:99px;background:var(--sf);color:var(--tx);font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.28);animation:pill .2s ease-out both;animation-delay:calc(var(--i)*45ms)}
.pi:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.pic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
@keyframes pill{from{opacity:0;transform:translateY(12px) scale(.92)}}
.mi{width:100%;border:0;background:none;color:var(--tx);text-align:left;cursor:pointer;min-height:54px}
.wd{text-align:right;line-height:1.1;flex:none}.wd b{font:700 32px Prompt,sans-serif;display:block}.wd span{font-size:11px;color:var(--mu)}
.wb{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--tx)}.wb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.wbar{height:6px;border-radius:99px;background:var(--bd);margin-top:12px;overflow:hidden}.wbar i{display:block;height:100%;background:var(--c)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:8;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}.toast.on{opacity:1}
.amt.un{font-size:13px;font-weight:500;color:var(--mu)}.amt.un small{color:var(--mu);font-size:11px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.lm{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}.lm>.ic{color:var(--mu);flex:none;margin-left:auto}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}.cd-h{display:flex;align-items:center;gap:12px}.cd-h .av{width:48px;height:48px;font-size:18px}
.cd-n{margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px;white-space:pre-wrap}
.t3{grid-template-columns:repeat(3,1fr)}.t3 .tile{padding:10px 12px}.t3 .tile b{font-size:17px}
.tg.b{background:color-mix(in srgb,#3b82f6 16%,transparent);color:#3b82f6}
.accs{padding-bottom:4px}.acc{flex:none;min-width:148px;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:1px;color:var(--tx);cursor:pointer}
.acc b{font-weight:600}.acc .bal{font:600 19px Prompt,sans-serif;margin-top:2px}.acc.on{border-color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.acc.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mu);min-width:110px;gap:4px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.tg.w{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#d97706}
.us{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.rl .x{border:0;background:none;color:var(--mu);margin-left:4px;padding:0 2px;cursor:pointer;font-size:15px;line-height:1}
.qn{background:var(--ink);color:var(--ac);font:600 12px Prompt,sans-serif;padding:1px 9px;border-radius:6px}.qrow{display:flex;gap:6px;align-items:center;align-self:flex-start;margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<header><div class="brand"><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="M9.5 8.5l5 5M14.5 8.5l-5 5"/></svg></span><div><h1>ร้านซ่อมมือถือ</h1><div class="who" id="who"></div></div></div><div class="hr"><select id="mon" onchange="M=this.value;R()" aria-label="เลือกเดือน"></select><button class="ib" id="pwb" onclick="fMyPw()" title="เปลี่ยนรหัสผ่านของฉัน" aria-label="เปลี่ยนรหัสผ่านของฉัน"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg></button><button class="ib" id="out" onclick="logout()" title="ออกจากระบบ" aria-label="ออกจากระบบ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button></div></header>
<main id="app"></main>
<button class="fab" id="fab" onclick="fabGo()" aria-label="เพิ่มรายการ"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="popwrap" id="popwrap" onclick="if(event.target===this)popClose()"><div class="pop" id="pop"></div></div>
<div class="toast" id="toast" role="status"></div>
<nav id="nav"></nav>
<div class="mod" id="mod"><div id="mbody"></div></div>
<script>
/* ===== ตั้งค่า Supabase: Project Settings > API ===== */
const SUPABASE_URL="https://lbmiywdkdrdwmwlmuzeh.supabase.co";
const SUPABASE_KEY="sb_publishable_2Cn8tWZin5thCimvtjGuug_QdiGrMkF";
/* ================================================== */
const def={cust:[],jobs:[],parts:[],trx:[],led:[],acc:[],xfer:[]};
const KINDS=Object.keys(def);
let S=JSON.parse(JSON.stringify(def)),snap=new Map(),busy=false,again=false,tm;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadAll(){
 const N={cust:[],jobs:[],parts:[],trx:[],led:[],acc:[],xfer:[]};snap=new Map();
 for(let from=0;;from+=1000){
  const {data,error}=await sb.from("shop_data").select("id,kind,data").order("id").range(from,from+999);
  if(error){alert("โหลดข้อมูลไม่สำเร็จ: "+error.message);break}
  data.forEach(r=>{if(N[r.kind]){N[r.kind].push(r.data);snap.set(r.id,JSON.stringify(r.data))}});
  if(data.length<1000)break}
 S=N;ensureQ()}
async function save(){
 if(busy){again=true;return}busy=true;
 try{
  const cur=new Map();KINDS.forEach(k=>S[k].forEach(x=>cur.set(x.id,{id:x.id,kind:k,data:x})));
  const up=[...cur.values()].filter(r=>snap.get(r.id)!==JSON.stringify(r.data));
  const del=[...snap.keys()].filter(id=>!cur.has(id));
  if(up.length){const {error}=await sb.from("shop_data").upsert(up);if(error)throw error;up.forEach(r=>snap.set(r.id,JSON.stringify(r.data)))}
  if(del.length){const {error}=await sb.from("shop_data").delete().in("id",del);if(error)throw error;del.forEach(id=>snap.delete(id))}
 }catch(e){alert("บันทึกไม่สำเร็จ: "+(e.message||e))}
 busy=false;if(again){again=false;save()}}
function loginView(){$("#nav").innerHTML="";$("#out").style.display="none";$("#pwb").style.display="none";
 $("#app").innerHTML=`<div class="card"><b>เข้าสู่ระบบ</b><label>อีเมล</label><input id="em" type="email" autocomplete="username"><label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password"><div class="bar"><button class="pr" onclick="login()">เข้าสู่ระบบ</button></div><div class="s out" id="err"></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error)$("#err").textContent=error.message;else location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){
 if(SUPABASE_URL.includes("YOUR-")){$("#app").innerHTML='<div class="card">ยังไม่ได้ตั้งค่า SUPABASE_URL และ SUPABASE_KEY ในไฟล์ (ดูหัวสคริปต์)</div>';return}
 const {data}=await sb.auth.getSession();
 if(!data.session){loginView();return}
 const {data:pf}=await sb.from("profiles").select("*").eq("user_id",data.session.user.id).maybeSingle();
 if(!pf||!pf.active){$("#nav").innerHTML="";$("#app").innerHTML='<div class="card">บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน หรือถูกปิดใช้งาน กรุณาติดต่อเจ้าของร้าน<div class="bar"><button class="gh" onclick="logout()">ออกจากระบบ</button></div></div>';return}
 ME=pf;if(ME.role!=="owner"){document.body.classList.add("staff");T="jobs"}
 $("#who").textContent=ME.role==="owner"?(ME.name||"")+" (เจ้าของ)":(ME.name||"")+" (พนักงาน)";
 await loadAll();R();
