<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>บัญชีร้านซ่อมมือถือ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--bd:#e2e7ec;--pr:#2563eb;--in:#16a34a;--out:#dc2626;--wa:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mu:#8d9aa8;--bd:#2a3541;--pr:#60a5fa;--in:#4ade80;--out:#f87171;--wa:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mu:#8d9aa8;--bd:#2a3541;--pr:#60a5fa;--in:#4ade80;--out:#f87171;--wa:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:15px;padding-bottom:70px}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}
main{max-width:720px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mu);font-size:12px}.v{font-size:20px;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700}
nav button b{display:block;font-size:18px}
button.pr,button.sm{border:0;border-radius:8px;background:var(--pr);color:#fff;padding:9px 14px;font:inherit;cursor:pointer}
button.sm{padding:4px 9px;font-size:12px;background:none;color:var(--out);border:1px solid var(--bd)}
button.gh{background:none;color:var(--pr);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row+.row{margin-top:6px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;border:1px solid var(--bd);color:var(--mu)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.mod{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
.mod.show{display:flex}
.mod>div{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}
.empty{text-align:center;color:var(--mu);padding:24px}
.bar{display:flex;gap:8px;margin:10px 0}
.s{font-size:13px;color:var(--mu)}
body.staff .sm{display:none}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<header><h1>🔧 บัญชีร้านซ่อมมือถือ</h1><div style="display:flex;gap:6px"><select id="mon" style="width:auto" onchange="M=this.value;R()"></select><button class="gh" id="pwb" onclick="fMyPw()">🔑</button><button class="gh" id="out" onclick="logout()">ออก</button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="mod" id="mod"><div id="mbody"></div></div>
<script>
/* ===== ตั้งค่า Supabase: Project Settings > API ===== */
const SUPABASE_URL="https://lbmiywdkdrdwmwlmuzeh.supabase.co";
const SUPABASE_KEY="sb_publishable_2Cn8tWZin5thCimvtjGuug_QdiGrMkF";
/* ================================================== */
const def={cust:[],jobs:[],parts:[],trx:[],led:[]};
const KINDS=Object.keys(def);
let S=JSON.parse(JSON.stringify(def)),snap=new Map(),busy=false,again=false,tm;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadAll(){
 const N={cust:[],jobs:[],parts:[],trx:[],led:[]};snap=new Map();
 for(let from=0;;from+=1000){
  const {data,error}=await sb.from("shop_data").select("id,kind,data").order("id").range(from,from+999);
  if(error){alert("โหลดข้อมูลไม่สำเร็จ: "+error.message);break}
  data.forEach(r=>{if(N[r.kind]){N[r.kind].push(r.data);snap.set(r.id,JSON.stringify(r.data))}});
  if(data.length<1000)break}
 S=N}
async function save(){
 if(busy){again=true;return}busy=true;
 try{
  const cur=new Map();KINDS.forEach(k=>S[k].forEach(x=>cur.set(x.id,{id:x.id,kind:k,data:x})));
  const up=[...cur.values()].filter(r=>snap.get(r.id)!==JSON.stringify(r.data));
  const del=[...snap.keys()].filter(id=>!cur.has(id));
  if(up.length){const {error}=await sb.from("shop_data").upsert(up);if(error)throw error;up.forEach(r=>snap.set(r.id,JSON.stringify(r.data)))}
  if(del.length){const {error}=await sb.from("shop_data").delete().in("id",del);if(error)throw error;del.forEach(id=>snap.delete(id))}
 }catch(e){alert("บันทึกไม่สำเร็จ: "+(e.message||e))}
 busy=false;if(again){again=false;save()}}
function loginView(){$("#nav").innerHTML="";$("#out").style.display="none";$("#pwb").style.display="none";
 $("#app").innerHTML=`<div class="card"><b>เข้าสู่ระบบ</b><label>อีเมล</label><input id="em" type="email" autocomplete="username"><label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password"><div class="bar"><button class="pr" onclick="login()">เข้าสู่ระบบ</button></div><div class="s out" id="err"></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error)$("#err").textContent=error.message;else location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){
 if(SUPABASE_URL.includes("YOUR-")){$("#app").innerHTML='<div class="card">ยังไม่ได้ตั้งค่า SUPABASE_URL และ SUPABASE_KEY ในไฟล์ (ดูหัวสคริปต์)</div>';return}
 const {data}=await sb.auth.getSession();
 if(!data.session){loginView();return}
 const {data:pf}=await sb.from("profiles").select("*").eq("user_id",data.session.user.id).maybeSingle();
 if(!pf||!pf.active){$("#nav").innerHTML="";$("#app").innerHTML='<div class="card">บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน หรือถูกปิดใช้งาน กรุณาติดต่อเจ้าของร้าน<div class="bar"><button class="gh" onclick="logout()">ออกจากระบบ</button></div></div>';return}
 ME=pf;if(ME.role!=="owner"){document.body.classList.add("staff");T="jobs"}
 $("#out").textContent=(ME.name||"")+" · ออก";
 await loadAll();R();
 sb.channel("shop").on("postgres_changes",{event:"*",schema:"public",table:"shop_data"},()=>{
  clearTimeout(tm);tm=setTimeout(async()=>{if(!$("#mod").classList.contains("show")&&!busy){await loadAll();R()}},700)}).subscribe()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const f=n=>Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
const STAT=["รับเครื่อง","กำลังซ่อม","ซ่อมเสร็จ","รับเครื่องแล้ว"];
let M=today().slice(0,7),T="sum";
const inM=d=>M==="all"||(d||"").startsWith(M);
const cn=id=>(S.cust.find(c=>c.id===id)||{name:"ลูกค้าทั่วไป"}).name;
const pn=id=>(S.parts.find(p=>p.id===id)||{name:"(ลบแล้ว)"}).name;
const tabs=[["sum","📊","สรุป"],["jobs","📱","งานซ่อม"],["cust","👤","ลูกค้า"],["parts","🔩","อะไหล่"],["led","💰","รายรับ-จ่าย"],["team","👥","ทีมงาน"]];
function months(){const s=new Set([today().slice(0,7)]);[...S.jobs,...S.trx,...S.led].forEach(x=>x.date&&s.add(x.date.slice(0,7)));
 $("#mon").innerHTML='<option value="all">ทั้งหมด</option>'+[...s].sort().reverse().map(m=>`<option ${m===M?"selected":""}>${m}</option>`).join("");$("#mon").value=M}
const $=s=>document.querySelector(s);
let ME={role:"owner"},TEAM=[];
function R(){save();months();
 const vis=tabs.filter(t=>ME.role==="owner"||(t[0]!=="sum"&&t[0]!=="team"));
 $("#nav").innerHTML=vis.map(t=>`<button class="${T===t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
 $("#app").innerHTML=({sum:vSum,jobs:vJobs,cust:vCust,parts:vParts,led:vLed,team:vTeam})[T]()}
function go(t){T=t;R();if(t==="team")loadTeam()}
async function loadTeam(){const {data}=await sb.from("profiles").select("*").order("created_at");TEAM=data||[];if(T==="team")R()}
const sb2=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
async function createStaff(v){
 const email=v.email.toLowerCase();
 const {data,error}=await sb2.auth.signUp({email,password:v.password});
 if(error){alert("สร้างบัญชีไม่สำเร็จ: "+error.message);return}
 if(!data.user||(data.user.identities&&data.user.identities.length===0)){alert("อีเมลนี้มีบัญชีอยู่แล้ว");return}
 const {error:e2}=await sb.from("profiles").insert({user_id:data.user.id,email,name:v.name,role:v.role,active:true});
 if(e2){alert("บันทึกสิทธิ์ไม่สำเร็จ: "+e2.message);return}
 if(!data.session)alert("สร้างบัญชีแล้ว แต่ Supabase ยังบังคับยืนยันอีเมล พนักงานต้องกดลิงก์ในอีเมลก่อนจึงล็อกอินได้ (หรือปิด Confirm email ในหน้า Authentication ของ Supabase)");
 await loadTeam()}
async function setActive(id,a){const {error}=await sb.from("profiles").update({active:a}).eq("user_id",id);if(error)alert(error.message);await loadTeam()}
function fMyPw(){form("เปลี่ยนรหัสผ่านของฉัน",[{k:"password",l:"รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)"}],v=>{if(v.password.length<6)return false;sb.auth.updateUser({password:v.password}).then(r=>alert(r.error?r.error.message:"เปลี่ยนรหัสผ่านแล้ว"))})}
function vTeam(){return `<div class="bar"><button class="pr" onclick="fStaff()">+ เพิ่มพนักงาน</button></div>`+(TEAM.length?TEAM.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="tag">${p.role==="owner"?"เจ้าของ":"พนักงาน"}${p.active?"":" · ปิดใช้งาน"}</span></div><div class="s">${esc(p.email)}</div>${p.user_id===ME.user_id?"":`<div class="row"><span></span><button class="sm" style="display:inline-block" onclick="setActive(\'${p.user_id}\',${!p.active})">${p.active?"ปิดใช้งาน":"เปิดใช้งาน"}</button></div>`}</div>`).join(""):'<div class="empty">กำลังโหลด...</div>')}
function fStaff(){form("เพิ่มพนักงาน",[{k:"name",l:"ชื่อพนักงาน"},{k:"email",l:"อีเมล (ใช้ล็อกอิน)",t:"email"},{k:"password",l:"รหัสผ่านเริ่มต้น (อย่างน้อย 6 ตัว)"},{k:"role",l:"สิทธิ์",o:[["staff","พนักงานหน้าร้าน"],["owner","เจ้าของ/ผู้จัดการ"]]}],v=>{if(!v.name||!v.email||v.password.length<6){alert("กรอกชื่อ อีเมล และรหัสผ่านให้ครบ");return false}createStaff(v)})}
init();
</script></body></html>
